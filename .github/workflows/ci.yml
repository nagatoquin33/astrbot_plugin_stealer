name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        # v7.0.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate release contracts
        run: python scripts/release.py validate

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -q

      - name: Lint Python
        run: python -m ruff check --config ruff.toml main.py plugin_api.py cache_service.py task_scheduler.py core tests scripts

      - name: Compile Python
        run: python -m compileall -q main.py plugin_api.py cache_service.py task_scheduler.py core tests scripts

      - name: Check dashboard JavaScript
        run: |
          node --check pages/dashboard/app.js
          node --check pages/dashboard/template.js

      - name: Build package smoke test
        if: matrix.python-version == '3.12'
        run: |
          VERSION=$(python -c 'from scripts.release import read_version; print(read_version())')
          python scripts/release.py package --version "$VERSION" --output-dir dist
