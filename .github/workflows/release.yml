name: Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - "metadata.yaml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to validate"
        required: true
        default: "master"
        type: string
      publish:
        description: "Create the tag and GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BEFORE_SHA: ${{ github.event.before }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release source
        # v7.0.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Resolve and validate metadata version
        run: |
          VERSION=$(python -c 'from scripts.release import read_version; print(read_version())')
          RELEASE_TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            PREVIOUS_VERSION=$(git show "${BEFORE_SHA}:metadata.yaml" | awk '/^version:/ { print $2; exit }')
            test -n "$PREVIOUS_VERSION"
            python scripts/release.py validate \
              --version "$VERSION" \
              --tag "$RELEASE_TAG" \
              --previous-version "$PREVIOUS_VERSION"
          else
            python scripts/release.py validate --version "$VERSION" --tag "$RELEASE_TAG"
          fi

      - name: Check release destination
        if: github.event_name == 'push' || inputs.publish
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force --quiet origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Run release test suite
        run: python -m pytest -p no:cacheprovider -q

      - name: Lint and compile
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 main.py plugin_api.py cache_service.py task_scheduler.py core tests scripts
          python -m compileall -q main.py plugin_api.py cache_service.py task_scheduler.py core tests scripts
          node --check pages/dashboard/app.js
          node --check pages/dashboard/template.js

      - name: Build installable plugin package
        run: |
          python scripts/release.py package --version "$VERSION" --output-dir dist
          python scripts/release.py notes --version "$VERSION" --output dist/release-notes.md
          {
            echo
            echo "## Verification"
            echo
            echo "- Full pytest suite passed."
            echo "- Ruff, Python compilation, dashboard JavaScript syntax and release contracts passed."
            echo "- The attached ZIP is the curated runtime plugin package; its SHA-256 file is provided alongside it."
          } >> dist/release-notes.md

      - name: Upload dry-run package
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dry-run-${{ env.RELEASE_TAG }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Create release tag
        if: github.event_name == 'push' || inputs.publish
        run: |
          if [[ "${TAG_EXISTS:-false}" != "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" HEAD
            git push origin "$RELEASE_TAG"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.publish
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/astrbot_plugin_stealer-${RELEASE_TAG}.zip" \
            "dist/astrbot_plugin_stealer-${RELEASE_TAG}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --title "Release $RELEASE_TAG" \
            --notes-file dist/release-notes.md \
            --generate-notes

      - name: Verify published assets
        if: github.event_name == 'push' || inputs.publish
        run: |
          mkdir -p verify
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "astrbot_plugin_stealer-${RELEASE_TAG}.zip" \
            --dir verify \
            --clobber
          (
            cd verify
            sha256sum -c "../dist/astrbot_plugin_stealer-${RELEASE_TAG}.zip.sha256"
          )
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,url
